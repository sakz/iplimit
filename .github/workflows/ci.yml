name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n iplimit install.sh tests/test.sh tests/test_tc_integration.sh
      - name: Run ShellCheck
        run: shellcheck iplimit install.sh tests/test.sh tests/test_tc_integration.sh
      - name: Run tests
        run: bash tests/test.sh
      - name: Run Debian traffic-control integration tests
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" debian:12-slim bash -lc '
            apt-get update >/dev/null &&
            apt-get install -y --no-install-recommends bash iproute2 conntrack kmod systemd iputils-ping >/dev/null &&
            bash /src/tests/test_tc_integration.sh
          '
