name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n iplimit install.sh tests/test.sh
      - name: Run ShellCheck
        run: shellcheck iplimit install.sh tests/test.sh
      - name: Run tests
        run: bash tests/test.sh
